#:schema "./node_modules/wrangler/config-schema.json"
name = "alcove-infotech"
main = "src/index.js"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

# Static assets for the main website
[assets]
directory = "./public"
binding = "ASSETS"

# Custom domain — www is the primary
[[routes]]
pattern = "www.alcoveinfotech.com"
custom_domain = true

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "alcove-tracker-db"
database_id = "89c96f5e-c1ac-4d2b-8a82-2edbcaa427cc"

# R2 bucket binding for resume storage
[[r2_buckets]]
binding = "RESUMES"
bucket_name = "alcove-resumes"

[observability]
enabled = true
